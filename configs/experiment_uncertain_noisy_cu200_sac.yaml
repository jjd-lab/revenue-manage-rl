# As experiment_uncertain_cu200_sac.yaml, with noisier daily demand: ±24
# bookings a day instead of ±8. Tests whether the planner's lead depends on
# nights being predictable.
demand:
  kind: tree_elastic
  demand_noise_std: 24.0
  night_variation:
    level_sd: 0.125
    elasticity_sd: 0.15
env:
  undersell_penalty: 200.0
  oversell_penalty: 400.0
  utilization_bonus: 0.0
  noshow_noise_std: 0.02
  cancel_rho_night_std: 0.05
  operator_view: true
algorithm:
  name: sac
  learning_rate: 0.0003
  gamma: 1.0
  batch_size: 256
  buffer_size: 200000
  learning_starts: 2000
  tau: 0.005
  ent_coef: auto
  n_envs: 1
  net_arch: [256, 256]
  device: cpu
train:
  total_timesteps: 200000
  seed: 7
  model_dir: artifacts/uncertain_nights
  run_name: uncertain_noisy_cu200
  log_dir: runs/uncertain_nights
