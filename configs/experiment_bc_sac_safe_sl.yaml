# Joint BC→SAC + safe SL projection (no retrain).
# Chance-style cap when remain < 20% capacity; mix_alpha softens the hard clip
# for a better score / oversell tradeoff.
demand:
  kind: tree_elastic

control:
  price_only: false
  safe_sl:
    enabled: true
    kind: chance
    overbook_factor: 1.02
    low_remain_frac: 0.05
    activate_remain_frac: 0.20
    mix_alpha: 0.25          # 0=hard project; 1=keep policy SL

algorithm:
  name: sac
  device: cpu

eval:
  n_episodes: 30

tune:
  shortfall_weight: 200.0

train:
  model_dir: artifacts/both_goals
  run_name: bc_sac_safe_sl
  log_dir: runs/both_goals
