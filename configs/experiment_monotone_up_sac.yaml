# Joint SAC, same hyperparameters as tree_long_sac, with a hard non-decreasing
# price. Later buyers never pay less than the price charged on the previous day.
# The first step of each episode is exempt (reset's price is a placeholder).
demand:
  kind: tree_elastic

control:
  price_only: false
  price_monotone:
    enabled: true
    direction: up
    mode: project
    tolerance: 0
    max_step: null
    apply_when_days_prior_le: null

algorithm:
  name: sac
  learning_rate: 0.0003
  gamma: 1.0
  batch_size: 256
  buffer_size: 200000
  learning_starts: 2000
  tau: 0.005
  ent_coef: auto
  n_envs: 1
  net_arch: [256, 256]
  device: cpu

train:
  total_timesteps: 200000
  seed: 7
  model_dir: artifacts/price_monotone
  run_name: monotone_up_project
  log_dir: runs/price_monotone_up
