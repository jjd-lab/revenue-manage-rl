[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reservation-pricing"
dynamic = ["version"]
description = "Reservation pricing and availability control with RL: a two-lever revenue-management environment, classical baselines, and Stable-Baselines3 agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jjd-lab" }]
keywords = ["reinforcement-learning", "revenue-management", "dynamic-pricing", "gymnasium", "stable-baselines3"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "gymnasium>=0.29",
  "stable-baselines3>=2.3.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "torch>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "optuna>=3.0",
  "matplotlib>=3.9",
  "ruff>=0.6",
]
tune = [
  "optuna>=3.0",
]

[project.urls]
Repository = "https://github.com/jjd-lab/revenue-manage-rl"
Documentation = "https://github.com/jjd-lab/revenue-manage-rl#readme"

[project.scripts]
rprl-train = "reservation_pricing.cli:train_main"
rprl-eval = "reservation_pricing.cli:eval_main"
rprl-tune = "reservation_pricing.cli:tune_main"
rprl-baselines = "reservation_pricing.cli:baselines_main"
rprl-fit-demand = "reservation_pricing.cli:fit_demand_main"
rprl-bc-sac = "reservation_pricing.cli:bc_sac_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reservation_pricing = ["demand/assets/*.joblib", "configs/*.yaml"]

[tool.setuptools.dynamic]
version = { attr = "reservation_pricing.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: trains an agent; skip with -m 'not slow'"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv.nosync", "artifacts", "private"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["reservation_pricing"]
